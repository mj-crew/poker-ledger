services:
  db:
    image: postgres:16-alpine
    container_name: poker_ledger_db
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker_ledger
    ports:
      - "5433:5432"
    volumes:
      - poker_ledger_pgdata:/var/lib/postgresql/data

volumes:
  poker_ledger_pgdata:
